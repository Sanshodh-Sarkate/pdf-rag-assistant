[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanshodh-Sarkate", email = "sanshodh@thesattvatech.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "cassandra-driver>=3.30.1",
    "cassio>=0.1.10",
    "chromadb>=1.5.9",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pyasyncore>=1.0.5",
    "pypdf>=7.0.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
]

[project.scripts]
rag-chatbot = "rag_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
